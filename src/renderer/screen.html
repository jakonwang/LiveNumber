<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveNumber</title>
<link rel="stylesheet" href="screen.css">
</head>
<body>
<div id="root" class="style-dark">
  <header class="bar">
    <div class="drag">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"> <defs> <linearGradient id="scr-bg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#2dd4bf"/> <stop offset="1" stop-color="#059669"/> </linearGradient> </defs> <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#scr-bg)"/> <path d="M150 92H362a62 62 0 0 1 62 62V304a62 62 0 0 1-62 62H254L156 440V366h-6a62 62 0 0 1-62-62V154a62 62 0 0 1 62-62z" fill="#ffffff"/> <g stroke="#0b1424" stroke-width="50" stroke-linecap="round"> <path d="M226 146 206 312"/> <path d="M314 146 294 312"/> <path d="M164 202H354"/> <path d="M156 262H346"/> </g> <circle cx="420" cy="104" r="54" fill="#ef4444" stroke="#19b594" stroke-width="22"/> </svg>
      <span class="live-dot" id="liveDot"></span>
      <span class="title" id="title">{{ $t('LIVE 抢单') }}</span>
    </div>
    <div class="today" id="today"></div>
    <div class="win-ctl" id="winCtl">
      <button id="btnPin" :title="$t('置顶')">📌</button>
      <button id="btnClose" :title="$t('关闭')">✕</button>
    </div>
  </header>

  <main id="stage"></main>

  <section class="hits" id="hitsBox">
    <div class="hits-title">{{ $t('最新下单') }}</div>
    <ul id="hits"></ul>
  </section>

  <div class="deal" id="deal" hidden>
    <div class="deal-tag">{{ $t('成交') }}</div>
    <div class="deal-amount" id="dealAmount"></div>
    <div class="deal-name" id="dealName"></div>
  </div>
</div>
<script src="../i18n/i18n.js"></script>
<script src="screen.js"></script>
</body>
</html>
